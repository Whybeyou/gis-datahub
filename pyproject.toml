[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-datahub"
version = "0.1.0"
description = "GIS 空间数据中台（mini）：摄取 / 质量治理 / 分层落库 / 指标服务 / 血缘"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "李昊", email = "18870235592@163.com" }]
dependencies = ["pandas>=2.0", "geopandas>=0.14", "shapely>=2.0", "pyproj>=3.5", "fastapi>=0.110"]

[project.optional-dependencies]
dev = ["pytest>=7", "uvicorn>=0.30", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Whybeyou/gis-datahub"

[tool.setuptools]
packages = ["hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
